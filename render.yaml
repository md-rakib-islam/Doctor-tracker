# Render Blueprint for the API. Secrets (MONGODB_URI, CORS_ORIGIN) are entered in the Render dashboard.
services:
  - type: web
    name: doctor-tracker-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: COOKIE_SAMESITE
        value: lax
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
